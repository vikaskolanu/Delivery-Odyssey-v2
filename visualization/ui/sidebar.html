<div class="do-sidebar">

    <!-- HEADER -->
    <div class="do-header">
        <div class="logo-mark"></div>
        <div>
            <h2>Delivery Odyssey</h2>
            <p>Dynamic Route Optimizer</p>
        </div>
    </div>

    <!-- RIDER -->
    <div class="card">
        <div class="card-label">Rider</div>
        <div id="current-status" class="status-box">
            <div class="status-row">
                <span>Status</span>
                <span class="chip moving">MOVING</span>
            </div>
            <div class="status-row">
                <span>Simulation</span>
                <span id="simulation-time">0 min</span>
            </div>
            <div class="status-row">
                <span>Speed</span>
                <span>350 m/min</span>
            </div>
        </div>
    </div>

    <!-- ACTIVE DELIVERIES -->
    <div class="card">
        <div class="card-label">Active Deliveries</div>
        <div id="active-orders-list">
            <div class="empty-state">No active orders</div>
        </div>
    </div>

    <!-- OPTIMIZER -->
    <div class="card">
        <div class="card-label">Optimizer</div>
        <div id="order-status" class="status-box muted">
            Waiting for an incoming order...
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="card">
        <div class="card-label">Controls</div>

        <div class="field-group">
            <label>Platform</label>
            <select id="order-platform">
                <option value="Zepto">Zepto</option>
                <option value="Blinkit">Blinkit</option>
                <option value="Instamart">Instamart</option>
            </select>
        </div>

        <button id="random-order" class="btn btn-primary">Random Order</button>
        <button id="map-pick-order" class="btn btn-secondary">Pick From Map</button>

        <div class="btn-row">
            <button id="play-agent-route" class="btn btn-primary">Play</button>
            <button id="pause-agent-route" class="btn btn-secondary">Pause</button>
        </div>

        <button id="restart-agent-route" class="btn btn-ghost">Restart</button>
    </div>

    <!-- LEGEND -->
    <div class="card">
        <div class="card-label">Legend</div>
        <div class="legend-grid">
            <div class="legend-item">
                <span class="dot rider"></span>
                <span>Rider</span>
            </div>
            <div class="legend-item">
                <span class="dot pickup"></span>
                <span>Pickup</span>
            </div>
            <div class="legend-item">
                <span class="dot customer"></span>
                <span>Customer</span>
            </div>
            <div class="legend-item">
                <span class="dot warehouse"></span>
                <span>Warehouse</span>
            </div>
        </div>
    </div>

</div>
