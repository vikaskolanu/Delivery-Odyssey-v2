<!-- LEFT PANEL -->
<div class="panel panel-left">
    <!-- HEADER -->
    <div class="do-header">
        <div>
            <h2>Delivery Odyssey</h2>
            <p>Dynamic Route Optimizer</p>
        </div>
    </div>
    
    <!-- RIDER -->
    <div class="card">
        <div class="card-label">Rider</div>
        <div id="current-status" class="status-box">
            Loading rider state...
        </div>
    </div>

    <!-- ACTIVE DELIVERIES -->
    <div class="card">
        <div class="card-label">Active Deliveries</div>
        <div class="helper-copy">Live order phases and delivery windows.</div>
        <div id="active-orders-list">
            <div class="empty-state">No active orders</div>
        </div>
    </div>
    
    <!-- DELIVERED ORDERS -->
    <div class="card">
        <div class="card-label">Delivered Orders</div>
        <div id="delivered-orders-list">
            <div class="empty-state">No delivered orders yet</div>
        </div>
    </div>
</div>

<!-- RIGHT PANEL -->
<div class="panel panel-right">
    <!-- OPTIMIZER -->
    <div class="card">
        <div class="card-label">Optimizer</div>
        <div id="order-status" class="status-box muted">
            Waiting for an incoming order...
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="card">
        <div class="card-label">Order Generation</div>

        <div class="field-group">
            <label>Platform</label>
            <select id="order-platform">
                <option value="Zepto">Zepto</option>
                <option value="Blinkit">Blinkit</option>
                <option value="Instamart">Instamart</option>
            </select>
        </div>

        <div class="field-group">
            <label>Delivery Time (m)</label>
            <input id="order-sla" type="number" min="1" step="1" value="15">
        </div>

        <button id="random-order" class="btn btn-primary">Random Order</button>
        <button id="map-pick-order" class="btn btn-secondary">Pick From Map</button>
    </div>


</div>

<!-- BOTTOM PANEL -->
<div class="panel panel-bottom">
    <button id="play-agent-route" class="btn btn-primary" style="margin: 0; min-width: 100px;">Play</button>
    <button id="pause-agent-route" class="btn btn-secondary" style="margin: 0; min-width: 100px;">Pause</button>
    <button id="restart-agent-route" class="btn btn-ghost" style="margin: 0; min-width: 100px;">Restart</button>
</div>
